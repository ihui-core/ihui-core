name: DocEngine CI

on:
  pull_request:
    branches: [ main ]
  push:
    branches: [ main ]
  schedule:
    - cron: '0 */6 * * *'

jobs:
  validate-and-build:
    name: Validate Sessions and Build Static Engine
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install jsonschema markdown

      - name: Run DocEngine Generator
        run: |
          python docengine/generate.py

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Dashboard Dependencies & Build
        run: |
          cd docengine/dashboard
          npm ci --legacy-peer-deps
          npm run build
